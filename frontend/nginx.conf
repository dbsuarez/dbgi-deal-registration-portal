server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    # A repeat order sends two letters of up to 10 MB each.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Static files only: compress text files and let browsers keep them. Pages and API answers are not
    # compressed, because they carry login tokens (compressing those over HTTPS allows the BREACH attack).
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;

    # Django and Unfold admin files. Their names do not change between versions while DEBUG is on, so
    # browsers keep them for one hour only.
    location /static/ {
        gzip on;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # The portal's built files: every build gives them new names, so browsers can keep them for a year.
    location /assets/ {
        gzip on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ ^/(admin|accounts|attachments|health)/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # index.html names the current build's files, so browsers always check it.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
