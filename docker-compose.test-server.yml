# Fake-data test install on a shared server, over plain HTTP. Not for a real launch.
# Every service has a memory limit, and only port 8081 is published, so the server's other
# services keep their memory and their web ports.
name: dbgi-portal

services:
  cache:
    image: redis:8.0-alpine
    restart: unless-stopped
    mem_limit: 32m
    command:
      ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "16mb"]
    networks:
      - backend

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 160m
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  web:
    image: dbgi-portal-web
    restart: unless-stopped
    mem_limit: 320m
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://cache:6379/1
    command:
      - sh
      - -c
      - >-
        python manage.py collectstatic --noinput &&
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2
        --access-logfile - --error-logfile -
    depends_on:
      cache:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    networks:
      - backend
      - edge

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    mem_limit: 32m
    depends_on:
      - web
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "8081:80"
    networks:
      - edge

volumes:
  postgres_data:
  media_data:

networks:
  backend:
    internal: true
  edge:
