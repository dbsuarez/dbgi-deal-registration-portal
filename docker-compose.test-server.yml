# DBGI portal on the Hostinger KVM4 server (4 CPUs, 16 GB), its permanent home since 2026-11-23.
# Still in test mode (DJANGO_DEBUG=true) while employees test it.
# The server is shared: Traefik (not ours) owns ports 80 and 443 and serves https://deals.dbgi.ph to our
# nginx through the labels below, with a free Let's Encrypt certificate. Port 8081 stays as a direct way in.
# Every service keeps a memory cap so the server's other services always keep their memory.
name: dbgi-portal

services:
  cache:
    image: redis:8.0-alpine
    restart: unless-stopped
    mem_limit: 256m
    command:
      ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb"]
    networks:
      - backend

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 2g
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=50"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  web:
    image: dbgi-portal-web
    restart: unless-stopped
    mem_limit: 2g
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://cache:6379/1
    command:
      - sh
      - -c
      - >-
        python manage.py collectstatic --noinput &&
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4
        --access-logfile - --error-logfile -
    depends_on:
      cache:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    networks:
      - backend
      - edge

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - web
    labels:
      traefik.enable: "true"
      traefik.docker.network: dbgi-portal_edge
      traefik.http.routers.dbgi-portal.rule: Host(`deals.dbgi.ph`)
      traefik.http.routers.dbgi-portal.entrypoints: websecure
      traefik.http.routers.dbgi-portal.tls.certresolver: letsencrypt
      traefik.http.services.dbgi-portal.loadbalancer.server.port: "80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "8081:80"
    networks:
      - edge

volumes:
  postgres_data:
  media_data:

networks:
  backend:
    internal: true
  edge:
