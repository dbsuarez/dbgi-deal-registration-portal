name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dbgi_ci
          POSTGRES_USER: dbgi_ci
          POSTGRES_PASSWORD: dbgi_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbgi_ci -d dbgi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt ruff
      - run: ruff check config registrations devtools
      - run: python manage.py check
        env:
          DJANGO_DEBUG: "true"
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_DEBUG: "true"
      - name: Test with SQLite
        run: python manage.py test registrations
        env:
          DJANGO_DEBUG: "true"
      - name: Test with PostgreSQL
        run: python manage.py test registrations
        env:
          DJANGO_DEBUG: "true"
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: dbgi_ci
          DB_USER: dbgi_ci
          DB_PASSWORD: dbgi_ci_password

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
